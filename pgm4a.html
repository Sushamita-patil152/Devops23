<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Count Consonants</title> 
</head> 
<body> 
    <h2>Count Consonants in a String</h2> 
    <p id="result"></p> 
    <script> 
        function countConsonants(str) { 
            let count=0; 
            str=str.toLowerCase(); 
            for (let i=0; i<str.length;i++) 
        { 
            let ch=str[i]; 
            if(ch>='a' && ch <='z' && !"aeiou".includes(ch)) 
        { 
            count++; 
        } 
        } 
        return count; 
        } 
        let input=prompt("Enter a string:"); 
        let result=countConsonants(input); 
 
        document.getElementById("result").innerHTML="Number of Consonants:"+result; 
    </script> 
     
</body> 
</html>
