<!DOCTYPE html>
<html>
	<head>
		<title>Fibonacci Number</title>
	</head>
	<body>
		<script>
			function sumFibonacci(n)
			{
				let a=0,b=1,sum=0;
				for(let i=1;i<=n;i++)
				{
					sum += a;
					let next = a + b;
					a = b;
					b = next;
				}	
				return sum
			}
			let n = parseInt(prompt("Enter the value of n: "));
			document.write("<h2>Sum of first\t" + n + "\tFibonacci Numbers is:\t" + sumFibonacci(n) + "</h2>");
		</script>		
	</body>
</html>
