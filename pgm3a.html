<!DOCTYPE html>
<html>
	<head>
		<title>Prime Number</title>
	</head>
	<body>
		<h2>Prime Number</h2>
		<p id = "result"></p>
		<script>
			let start = parseInt(prompt("Enter your Starting Number: "));
			let end = parseInt(prompt("Enter your Ending Number: "));
			let output = "";
			for(let i=start;i<=end;i++){
				if(i<2) continue;
				let isPrime = true;
				for(let j=2;j<=Math.sqrt(i);j++)
				{
					if(i%j==0)
					{
						isPrime = false;
						break;
					}					
				}
				if(isPrime)
				{
					output += i+ " ";
				}
			}
			if(output === "")
			{
				document.getElementById("result").innerHTML = "No Prime numbers found";
			}
			else{
				document.getElementById("result").innerHTML = "Prime numbers between: " +start+ " and " +end+ " are " +output;

			}
		</script>		
	</body>
</html>
