<!DOCTYPE html>
<html>
    <head>
        <title>CSS Properties Demo</title>

        <style>

        /* ID Selector */
        #title{
            color:red;
            text-align:center;
            text-decoration:underline;
            text-transform:uppercase;
            letter-spacing:2px;
            font-family:Arial;
            font-size:20px;
            font-style:italic;
            font-weight:bold;
            text-shadow:2px 2px 5px red;
        }

        /* Sticky Position */
        .sticky-box{
            position:sticky;
            top:10px;
            background-color:rgb(62, 235, 177);
            padding:10px;
            border:2px solid black;
            text-align:center;
        }

        /* Container */
        .container{
            margin:20px;
        }

        /* Class Selector */
        .flexbox{
            width:300px;
            height:200px;

            background-color:lightblue;

            border:2px solid black;
            border-width:2px;
            border-style:dashed;
            border-color:rgba(198, 82, 82, 0.907);
            border-radius:10px;

            margin:20px;
            margin-top:10px;

            padding:15px;
            padding-left:20px;

            box-shadow:5px 5px 10px gray;

            opacity:0.9;

            /* Flexbox Properties */
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            flex-wrap:wrap;
            gap:10px;

            overflow:auto;

            position:relative;
            left:20px;

            transition:all 1s;
        }

        /* Hover */
        .flexbox:hover{
            background-color:orange;
            transform:scale(1.1);
            cursor:pointer;
        }

        /* Descendant Selector */
        .flexbox p{
            color:blue;
            line-height:30px;
            text-align:center;
        }

        /* Child Selector */
        .flexbox > h2{
            text-transform:uppercase;
            text-align:center;
        }

        /* Table Properties */
        table{
            width:50%;
            border-collapse:collapse;
            border-spacing:5px;
        }

        caption{
            caption-side:top;
            font-weight:bold;
        }

        table,th,td{
            border:1px solid black;
            padding:10px;
            text-align:center;
        }

        /* Header Cells */
        th{
            background-color:rgba(247, 4, 154, 0.737);
            color:black;
        }

        /* Data Cells */
        td{
            background-color:lightpink;
        }

        /* Animation */
        .animate{
            width:100px;
            height:100px;
            
            background-image: url("sunflower.jpg");
            background-size:contain;
            background-repeat:no-repeat;
            background-position:center;

            animation-name:move;
            animation-duration:3s;
            animation-iteration-count:infinite;
        }

        @keyframes move{
            from{
                transform:translate(0px,0px);
            }
            to{
                transform:translate(150px,0px);
            }
        }

        </style>

    </head>
    <body>

        <h1 id="title">CSS Properties Demonstration</h1>

        <div class="sticky-box">
            Sticky Position Example
        </div>

        <div class="container">

            <!-- Single Flexbox -->
            <div class="flexbox">

                <h2>Demo Box</h2>

                <p>
                    This paragraph demonstrates text properties,
                    background, border, padding, margin,
                    flexbox, overflow and hover effect.
                </p>

            </div>

        </div>

        <h2>Table Example</h2>

        <table>

            <caption>Student Details</caption>

            <tr>
                <th>Name</th>
                <th>Marks</th>
            </tr>

            <tr>
                <td>Sushamita</td>
                <td>90</td>
            </tr>

        </table>

        <h2>Animation Example</h2>

        <div class="animate"></div>

    </body>
</html>
